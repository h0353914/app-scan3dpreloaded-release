org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.java.home=/home/h/lineageos/prebuilts/jdk/jdk11/linux-x86

# 建構效能
org.gradle.parallel=true
org.gradle.caching=true

# 原始 APK 實際使用 androidx.*（smali/androidx 下有 appcompat/recyclerview/
# fragment/lifecycle-* 等套件，版本對照 unknown/META-INF/*.version 皆為
# androidx 世代版本號，並非舊版 android.support 相容庫），故啟用 AndroidX。
android.useAndroidX=true
android.enableJetifier=false
