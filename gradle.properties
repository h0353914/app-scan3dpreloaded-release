org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.java.home=/home/h/lineageos/prebuilts/jdk/jdk11/linux-x86

# 建構效能
org.gradle.parallel=true
org.gradle.caching=true

# 原始 APK 實際使用 androidx.*（smali/androidx 下有 appcompat/recyclerview/
# fragment/lifecycle-* 等套件，版本對照 unknown/META-INF/*.version 皆為
# androidx 世代版本號，並非舊版 android.support 相容庫），故啟用 AndroidX。
android.useAndroidX=true
android.enableJetifier=false

# release 建置預設會跑 aapt2 optimize（optimizeReleaseResources task），除了把
# res 檔名混淆成類似 res/KY1.xml 這種短檔名之外，實測發現它會讓某些資源（例如
# layout XML 裡引用的 @id/view_pager）編譯出的數值跟 res/values/public.xml
# 釘住的值不一致（0x7f09021b vs public.xml 的 0x7f09021d），導致
# findViewById() 用 R.id.xxx（對照 public.xml 產生）找不到實際上 id 已經跑掉
# 的 view，執行期 NullPointerException。關掉這個最佳化，讓資源 id 全程穩定
# 對照 public.xml。
android.enableResourceOptimizations=false
